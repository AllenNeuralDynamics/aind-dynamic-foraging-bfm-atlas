[project]
name = "bfm-atlas"
version = "0.1.0"
description = "Provenance-traced catalog and browser for aind-dynamic-foraging-bfm-studies"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
bfm-atlas = "bfm_atlas.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
