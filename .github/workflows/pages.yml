name: Deploy atlas

# Rebuild from studies main on every atlas change, daily (studies merges do not notify this
# repo), and on demand.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * *"   # 06:17 PT
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install .

      - uses: actions/checkout@v4
        with:
          repository: AllenNeuralDynamics/aind-dynamic-foraging-bfm-studies
          path: studies
          fetch-depth: 0     # report history is built from git log

      - name: Build the catalog and copy figures
        run: bfm-atlas build --studies studies --out site/data/catalog.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
